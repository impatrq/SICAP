<ion-content [fullscreen]="true" class="page">
  <div class="wrap">

    <div class="center" *ngIf="loading"><ion-spinner></ion-spinner></div>
    <ion-text color="danger" class="center" *ngIf="!loading && error">{{ error }}</ion-text>

    <section class="grid" *ngIf="!loading">

      <article class="card new" (click)="abrirCrear()">
        <div class="poster plus">+</div>
        <div class="name">Crear Usuario</div>
      </article>

      <article class="card" *ngFor="let p of panoles">
        <button class="poster" (click)="abrirPanol(p)">
          <ion-icon [name]="'cube'"></ion-icon>
        </button>
        <div class="name">{{ p.nombre }}</div>
      </article>
    </section>

    <ion-modal mode="md" cssClass="tarjeta-modal" [isOpen]="creating" (didDismiss)="cancelarCrear()"  [presentingElement]="null">
      <ng-template>
        <ion-header>
          <ion-toolbar>
            <ion-title>Personalizar</ion-title>
              <ion-buttons slot="end">
                <ion-button (click)="cancelarCrear()" class="btn-close">
                  <ion-icon name="close-outline"></ion-icon>
              </ion-button>
            </ion-buttons>
          </ion-toolbar>
        </ion-header>
        <ion-content class="ion-padding">
          <ion-item>
            <ion-input label="Nombre" labelPlacement="floating" [(ngModel)]="nombreNuevo"></ion-input>
          </ion-item>
          <div class="row mt">
            <ion-button [disabled]="saving || !nombreNuevo.trim()" (click)="crear()">Crear</ion-button>
            <ion-button fill="clear" (click)="cancelarCrear()">Cancelar</ion-button>
          </div>
          <ion-text color="danger" *ngIf="error">{{ error }}</ion-text>
        </ion-content>
      </ng-template>
    </ion-modal>

  </div>
</ion-content>
