<ion-header>
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-menu-button></ion-menu-button>
    </ion-buttons>
    <ion-title>HOME</ion-title>
  </ion-toolbar>
</ion-header>

<!-- Toolbar lateral solo si está activa la Interfaz Visual -->
<div *ngIf="mostrarToolbarVisual" class="vertical-toolbar">
  <ion-button *ngFor="let opcion of opcionesMenu" expand="block" [disabled]="opcion === 'Interfaz Visual'">
    {{ opcion }}
  </ion-button>
  <ion-button expand="block" color="medium" (click)="volverAlMenuCentral()">Volver</ion-button>
</div>

<ion-content [fullscreen]="true">
  <!-- Menú central solo si NO está activa la Interfaz Visual -->
  <div *ngIf="!mostrarToolbarVisual" class="botones-menu-central">
    <ion-button expand="block" (click)="activarInterfazVisual()">Interfaz Visual</ion-button>
    <ion-button expand="block" (click)="activarInterfazVisual()">Registros y Movimientos</ion-button>
    <ion-button expand="block" (click)="activarInterfazVisual()">Reportes</ion-button>
    <ion-button expand="block" (click)="activarInterfazVisual()">Gestión de Pañol 1</ion-button>
    <ion-button expand="block" (click)="activarInterfazVisual()">Gestión de Pañol 2</ion-button>
    <ion-button expand="block" (click)="activarInterfazVisual()">Gestión de Pañol 3</ion-button>
  </div>

  <!-- Pantalla libre para la interfaz visual -->
  <div *ngIf="mostrarToolbarVisual" class="visual-content">
    <h2>Interfaz Visual</h2>
  </div>
</ion-content>
