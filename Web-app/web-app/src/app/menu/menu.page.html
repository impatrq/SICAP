<ion-content [fullscreen]="true" class="page">
  <div class="wrap">
    <!-- Estado: loading -->
    <div class="center" *ngIf="loading">
      <ion-spinner></ion-spinner>
    </div>

    <!-- Mensaje de error si la carga falló -->
    <ion-text color="danger" class="center" *ngIf="!loading && error">
      {{ error }}
    </ion-text>

    <!-- Grid de tarjetas: crear + listas de pañoles -->
    <section class="grid" *ngIf="!loading">
      <!-- Tarjeta para crear un nuevo pañol -->
      <article class="card new" (click)="abrirCrear()">
        <div class="poster plus">+</div>
        <div class="name">CREAR USUARIO</div>
      </article>

      <!-- Tarjeta por cada pañol -->
      <article class="card" *ngFor="let p of panoles">
        <!-- Click en el área principal abre el pañol -->
        <button class="poster" (click)="abrirPanol(p)">
          <ion-icon [name]="'cube'"></ion-icon>
        </button>

        <!-- Acciones rápidas (renombrar / eliminar) -->
        <div class="actions-bar icons-only" (click)="$event.stopPropagation()">
          <!-- Renombrar -->
          <button
            class="icon-btn"
            title="Renombrar"
            aria-label="Renombrar"
            (click)="abrirRenombrar(p, $event)"
          >
            <ion-icon name="pencil"></ion-icon>
          </button>
          <!-- Eliminar (abre confirmación) -->
          <button
            class="icon-btn danger"
            title="Eliminar"
            aria-label="Eliminar"
            (click)="confirmarEliminar(p, $event)"
          >
            <ion-icon name="trash"></ion-icon>
          </button>
        </div>

        <!-- Nombre del pañol -->
        <div class="name">{{ p.nombre }}</div>
      </article>
    </section>

    <!-- Modal: crear nuevo pañol -->
    <ion-modal
      mode="md"
      cssClass="tarjeta-modal"
      [isOpen]="creating"
      (didDismiss)="cancelarCrear()"
      [presentingElement]="null"
    >
      <ng-template>
        <ion-header>
          <ion-toolbar>
            <ion-title>Personalizar</ion-title>
            <ion-buttons slot="end">
              <ion-button (click)="cancelarCrear()" class="btn-close">
                <ion-icon name="close-outline"></ion-icon>
              </ion-button>
            </ion-buttons>
          </ion-toolbar>
        </ion-header>

        <ion-content class="ion-padding">
          <!-- Input para el nombre del nuevo pañol -->
          <ion-item>
            <ion-input
              label="Nombre"
              labelPlacement="floating"
              [(ngModel)]="nombreNuevo"
            ></ion-input>
          </ion-item>

          <!-- Botones: crear / cancelar -->
          <div class="row mt">
            <ion-button
              [disabled]="saving || !nombreNuevo.trim()"
              (click)="crear()"
            >
              Crear
            </ion-button>
            <ion-button fill="clear" (click)="cancelarCrear()">
              Cancelar
            </ion-button>
          </div>

          <!-- Error dentro del modal (si ocurre) -->
          <ion-text color="danger" *ngIf="error"> {{ error }} </ion-text>
        </ion-content>
      </ng-template>
    </ion-modal>
  </div>
</ion-content>
