<div *ngIf="!animacionTerminada" class="splash-container">
  <lottie-player
    src="assets/Animaciones/animacion.login.json"
    background="transparent"
    speed="1"
    autoplay
    (complete)="onAnimationComplete()">
  </lottie-player>
</div>

<div *ngIf="animacionTerminada" class="login-content ion-padding">
  
  <div class="logo-container">
    <img src="assets/Images/Logo-chiquito.png" alt="Logo SICAP" />
  </div>

  <ion-card>

<ion-card-content>
      <form>
        <ion-item>
          <ion-icon name="person-outline" slot="start" color="medium"></ion-icon>
          <ion-label position="floating">Usuario</ion-label>
          <ion-input type="text"></ion-input>
        </ion-item>

        <ion-item>
          <ion-icon name="lock-closed-outline" slot="start" color="medium"></ion-icon>
          <ion-label position="floating">Contraseña</ion-label>
          <ion-input type="password"></ion-input>
        </ion-item>
          
          <br>

          <ion-button type="submit" expand="block" shape="round">
            Ingresar
          </ion-button>
        </form>
      </ion-card-content>
    </ion-card>
  </div>
