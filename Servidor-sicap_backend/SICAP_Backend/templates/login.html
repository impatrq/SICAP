<!doctype html>
<html lang="es">
  <head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ingresar</title></head>
  <body style="font-family: system-ui; max-width: 360px; margin: 40px auto;">
    <h1>Ingresar a SICAP</h1>
    {% if form.errors %}<p style="color:red">Usuario o contraseña incorrectos.</p>{% endif %}
    <form method="post">{% csrf_token %}
      <p><label>Usuario<br>{{ form.username }}</label></p>
      <p><label>Contraseña<br>{{ form.password }}</label></p>
      <p><button type="submit">Entrar</button></p>
    </form>
  </body>
</html>
